name: build apps

# Every push to master/main creates the next version tag (patch bump of the latest
# tag), builds the apps and publishes the release with the automatic changelog.
# Manual run: Actions -> build apps -> Run workflow (optionally with a version).
# To push without a release, put [skip ci] in the commit message.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release (e.g. v1.2.3). Empty = bump the patch of the latest tag."
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: next version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the version
        id: next
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"
          if [ -n "$input" ]; then
            tag="$input"
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            if [ -z "$latest" ]; then
              tag="v1.0.0"
            else
              base="${latest#v}"
              major="${base%%.*}"
              rest="${base#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              patch=$((patch+1))
              tag="v${major}.${minor}.${patch}"
            fi
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $tag (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - name: Create and push the tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact: scuolagrab-linux-x86_64
          - name: windows-x64
            os: windows-latest
            artifact: scuolagrab-windows-x64
          - name: macos-arm64
            os: macos-14
            artifact: scuolagrab-macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build app
        run: python packaging/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packaging/dist/*.AppImage
            packaging/dist/*.zip
            packaging/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the built apps
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: scuolagrab-*
          merge-multiple: true

      - name: Show the release files
        run: ls -lh dist

      - name: Create the release with the changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: scuolagrab ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
