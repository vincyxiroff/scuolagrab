name: build apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact: scuolagrab-linux-x86_64
          - name: windows-x64
            os: windows-latest
            artifact: scuolagrab-windows-x64
          - name: macos-arm64
            os: macos-14
            artifact: scuolagrab-macos-arm64
          - name: macos-x64
            os: macos-13
            artifact: scuolagrab-macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build app
        run: python packaging/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packaging/dist/*.AppImage
            packaging/dist/*.zip
            packaging/dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/*.AppImage
            packaging/dist/*.zip
